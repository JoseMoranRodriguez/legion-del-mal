
name: Comunicador de la Legion

on:
  workflow_dispatch:
    inputs:
      villano:
        description: "Que villano envia el mensaje?"
        required: true
        type: choice
        options:
          - "Lex Luthor"
          - "Brainiac"
          - "Darkseid"
          - "Sinestro"
          - "Cheetah"
          - "Black Manta"
          - "Deathstroke"
          - "Bizarro"
          - "Gorilla Grodd"
          - "Captain Cold"

      mensaje:
        description: "Mensaje para el consejo"
        required: true
        default: "La mision fue un exito"

      prioridad:
        description: "Nivel de prioridad"
        required: true
        type: choice
        options:
          - Normal
          - Alta
          - Critica
          

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  transmitir-mensaje:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    steps:
      - name: Instalar el transmisor de la Legion
        run: sudo apt-get install -y cowsay

      - name: Imprimir inputs
        run: |
          echo "================================"
          echo "    Transmision Interceptada   "
          echo "================================"
          echo ""
          echo "De: ${{inputs.villano}}"
          echo ""
          echo "Fecha: $(date -u + "%d/%m/%Y - %H:%M UTC")"
          echo "---------Mensaje ---------"
          cowsay -f eyes "${{inputs.mensaje}}"
          echo ""
          echo "--- ${{ inputs.villano}}"
          echo "..."
