# ╔══════════════════════════════════════════════════════╗
# ║        BIENVENIDA AUTOMÁTICA DE BRAINIAC             ║
# ║                                                      ║
# ║  Cada vez que alguien abre un issue, Brainiac        ║
# ║  responde de inmediato con un comentario avisando    ║
# ║  que el issue está siendo revisado.                  ║
# ╚══════════════════════════════════════════════════════╝

name: 🤖 Bienvenida de Brainiac - Nuevo issue
on:
  #issues:
   # types: [opened]

   ## remover esto cuando lo tengan listo para prod.
   workflow_dispatch:

permissions:
  issues: write

jobs:
  responder:
    runs-on: ubuntu-latest
    steps:
      - name: Brainiac responde al issue
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const autor = context.payload.issue.user.login;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🤖 ¡Saludos, @${autor}!\n\n` +
                    `Tu issue ha sido recibido y **está siendo revisado por Brainiac** 🧠.\n` +
                    `La Legión del Mal te responderá en cuanto el análisis haya concluido.`
            });

      - name: Brainiac envía aviso por correo electrónico
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Brainiac <${{ secrets.MAIL_USERNAME }}>
          to: fernando@google.com
          subject: "🧠 Nuevo issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}"
          body: |
            Brainiac ha detectado un nuevo issue en ${{ github.repository }}.

            Título: ${{ github.event.issue.title }}
            Autor: ${{ github.event.issue.user.login }}
            Enlace: ${{ github.event.issue.html_url }}

            El issue está siendo revisado por Brainiac.
